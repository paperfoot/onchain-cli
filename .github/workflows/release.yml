name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, os, sys
          metadata = json.load(sys.stdin)
          version = next(package["version"] for package in metadata["packages"] if package["name"] == "onchain")
          tag = os.environ["TAG"]
          expected = tag.removeprefix("v")
          if version != expected:
              raise SystemExit(f"tag {tag} does not match onchain package version {version}")
          '

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist package
          cp "target/${TARGET}/release/onchain" LICENSE README.md package/
          tar -C package -czf "dist/onchain-${TAG}-${TARGET}.tar.gz" onchain LICENSE README.md

      - name: Upload release archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: onchain-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/onchain-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes
