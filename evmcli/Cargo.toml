[package]
name = "onchain"
version = "0.2.2"
edition = "2021"
rust-version = "1.94.1"
description = "Fast EVM and Zcash queries, transaction investigation, and swap quotes"
license = "MIT"
repository = "https://github.com/paperfoot/onchain-cli"
homepage = "https://github.com/paperfoot/onchain-cli"
readme = "../README.md"
keywords = ["zcash", "ethereum", "blockchain", "cli", "swaps"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[[bin]]
name = "onchain"
path = "src/main.rs"

[lib]
name = "onchain"
path = "src/lib.rs"

[dependencies]
alloy = { version = "2.4.2", default-features = false, features = ["std", "providers", "contract", "reqwest-rustls-tls", "dyn-abi", "json-abi", "rpc-types", "network"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
bs58 = { version = "0.5", features = ["check"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
comfy-table = "7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
hex = "0.4"
semver = "1"

[dev-dependencies]
wiremock = "0.6"
